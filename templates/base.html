<!DOCTYPE html>
<html lang="en">

<head>
    {% block head %}
    <meta charset="UTF-8">
    <title>tobischmitt.net</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    {% endblock %}
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;
            color: #111;
            background-color: #EEE;
            @media (prefers-color-scheme: dark) {
                background-color: #333;
                color: #fff;
            }
        }
        a {
            color: teal;
            @media (prefers-color-scheme: dark) {
                color: lightblue;
            }
        }
        .center {
            max-width: 41em;
            margin-left: auto;
            margin-right: auto;
        }
        pre {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topnav {
            font-size: 1.8em;
        }
        #topnavleft {
            float: left;
        }
        #topnavleft a {
            margin-right: 0.2em;
            text-decoration: none;
        }
        #topnavright {
            text-align: right;
            text-decoration: none;
        }
        #topnavright a {
            margin-left: 0.2em;
            text-decoration: none;
        }
        .postpreview {
            margin-top: 1em;
        }
    </style>
</head>

<body>
    <div class="center">
        <div>
            <div class="topnav" id="topnavleft">
                <a href="/" title="home">🏠</a>
                <a href="/blog/" title="blog">🗞️</a>
                <a href="/about/" title="about me">🙋‍♂️</a>
            </div>
            <div class="topnav" id="topnavright">
                <a href="https://indieweb.social/@tsmt09" title="mastodon">🦣</a>
                <a href="https://github.com/tsmt09" title="github">🐙</a>
                <a href="https://gitlab.com/tsmt" title="github">🦊</a>
            </div>
        </div>
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
