{% extends "base.html" %}

{% block content %}
<h1>
{{ section.title }}
</h1>
<p>
{{ section.description }}
</p>
<p>
{{ section.content | safe }}
</p>
<div>
  <ul>
    {% for page in section.pages %}
    <li>
      <a href="{{ page.permalink }}">{{ page.title }} <small>({{ page.date | date(format=config.extra.date_format) }})</small></a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
