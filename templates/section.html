{% extends "base.html" %}

{% block content %}
<h1>
{{ section.title }}
</h1>
<p>
{{ section.description }}
</p>
<p>
{{ section.content | safe }}
</p>
<div>
    {% for page in section.pages %}
    <div>
      <large><a href="{{ page.permalink }}">{{ page.title }}</a></large><br>
      <small>({{ page.date | date(format=config.extra.date_format) }})</small>
    </div>
    {% endfor %}
</div>
{% endblock %}
